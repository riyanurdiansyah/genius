<!DOCTYPE html>

<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="wrapper">
        <div class="dashboard-container">

            <!-- SIDEBAR SAMA PERSIS DENGAN KUDA TEMPLATE -->
            <div class="sidebar-wrapper" id="mainSidebar">
                <div class="logo-area">

                <aside class="sidebar">

                </aside>
            </div>

            <!-- MAIN CONTENT -->
            <div class="main-content">

                <!-- TOPBAR MIRIP TEMPLATE ASLI -->
                <header class="topbar">

                    <div class="custom-chart-container">
                        <div class="chart-header-flex">
                            <div class="chart-header-title">

                                Spline Area Chart
                            </div>
                            <button class="btn btn-sm btn-outline-primary copy-btn"><i class="fa-regular fa-copy"></i>
                                Copy HTML</button>
                        </div>
                        <div class="chart-canvas-wrapper" id="chart-spline"></div>
                    </div>

                    <div class="custom-chart-container">
                        <div class="chart-header-flex">
                            <div class="chart-header-title">
                                <div class="chart-icon"><i class="fa-solid fa-border-all"></i></div>
                                Heatmap Chart
                            </div>
                            <button class="btn btn-sm btn-outline-primary copy-btn"><i class="fa-regular fa-copy"></i>
                                Copy HTML</button>
                        </div>
                        <div class="chart-canvas-wrapper" id="chart-heatmap"></div>
                    </div>

                    <div class="custom-chart-container">
                        <div class="chart-header-flex">
                            <div class="chart-header-title">
                                <div class="chart-icon"><i class="fa-solid fa-satellite-dish"></i></div>
                                Radar Variant
                            </div>
                            <button class="btn btn-sm btn-outline-primary copy-btn"><i class="fa-regular fa-copy"></i>
                                Copy HTML</button>
                        </div>
                        <div class="chart-canvas-wrapper" id="chart-radar-apex" style="min-height: 365px;"></div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- HANYA IMPORT DARI KUDA KIT (jQuery, Bootstrap JS & DataTables sudah ada di dalam sini) -->
    <script src="./kuda-cdn/js/kuda-kit.js?v=1.5"></script>


    <script>
        $(document).ready(function () {

            // --- CONTOH UPDATE DATA DARI API/DATABASE (Simulasi Ajax Request) ---
            // Sengaja kita beri delay komputasi 2 detik, seolah-olah ambil data dari endpoint API
            setTimeout(function () {

                // Cara 1: Menggunakan instance dari window.KudaCharts (Sangat disarankan)
                if (window.KudaCharts && window.KudaCharts['chart-heatmap']) {
                    window.KudaCharts['chart-heatmap'].updateSeries([
                        { name: 'Server Asia', data: [{ x: 'Senin', y: 12 }, { x: 'Selasa', y: 80 }, { x: 'Rabu', y: 45 }] },
                        { name: 'Server Eropa', data: [{ x: 'Senin', y: 56 }, { x: 'Selasa', y: 24 }, { x: 'Rabu', y: 92 }] }
                    ]);
                }

                // Cara 2: Menggunakan bawaan global ApexCharts.exec
                // Format: ApexCharts.exec('ID-CHART', 'NAMA-METHOD', [DATA-BARU]);
                ApexCharts.exec('chart-radar-apex', 'updateSeries', [{
                    name: 'Target Penjualan (DB)',
                    data: [100, 100, 100, 100, 100, 100]
                }, {
                    name: 'Aktual Penjualan (DB)',
                    data: [80, 85, 90, 80, 60, 90]
                }]);

                console.log("Simulasi: Data chart berhasil ditimpa dengan data dari Database!");

            }, 2000);
            // ----------------------------------------------------------------------


            // Inisialisasi Ajax DataTable
            $('#table-ajax').DataTable({
                ajax: {
                    url: 'https://api.restful-api.dev/objects',
                    dataSrc: ''
                },
                columns: [
                    { data: 'id', width: '20%' },
                    { data: 'name' },
                    {
                        data: 'data',
                        render: function (data) {
                            if (!data) return '<span class="text-muted small">No extra data...</span>';
                            return Object.entries(data).map(([key, value]) => `<span class="badge bg-light text-dark border me-1">${key}: ${value}</span>`).join('');
                        }
                    }
                ],
                pageLength: 5,
                lengthMenu: [5, 10, 25],
                language: {
                    search: "_INPUT_",
                    searchPlaceholder: "Search device..."
                }
            });

        });
    </script>
